      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Shimmer -->
    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#059669" stroke-opacity=".3"/>
    </linearGradient>

    <!-- Progress Bar Gradients -->
