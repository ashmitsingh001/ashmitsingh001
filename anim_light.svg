<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" role="img" aria-label="Ashmit Singh - GitHub Contribution Heatmap &amp; Tech Stack Matrix">
  <title>GitHub Contribution Heatmap &amp; Tech Stack Matrix — Ashmit Singh</title>

  <style type="text/css">
  <![CDATA[
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Fira Code', 'Liberation Mono', Menlo, monospace; }

    .pulse-glow { animation: pulseGlow 2s infinite ease-in-out; }
    @keyframes pulseGlow { 0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #059669); } 50% { opacity: 0.35; } }
  ]]>
  </style>

  <defs>
    <clipPath id="mainClip"><rect width="1180" height="300" rx="16" ry="16"/></clipPath>

