<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="280" viewBox="0 0 1180 280" role="img" aria-label="Ashmit Engine - Live Animated Terminal &amp; Neural Radar">
  <title>Ashmit Engine — Live Animated Terminal &amp; Neural Radar Banner</title>

  <style type="text/css">
  <![CDATA[
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Fira Code', 'Liberation Mono', Menlo, monospace; }
  ]]>
  </style>

  <defs>
    <clipPath id="mainClip"><rect width="1180" height="280" rx="16" ry="16"/></clipPath>

    <!-- Mesh Diffusions -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity=".80"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#ede9fe" stop-opacity=".70"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Shimmer -->
    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#059669" stroke-opacity=".3"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Pattern -->
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(15, 23, 42, 0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <g clip-path="url(#mainClip)">
    <!-- Base Canvas -->
    <rect width="1180" height="280" fill="#f8fafc"/>
    <rect width="1180" height="280" fill="url(#bgGlow1)"/>
    <rect width="1180" height="280" fill="url(#bgGlow2)"/>
    <rect width="1180" height="280" fill="url(#gridPattern)"/>

    <!-- ================================================================= -->
    <!-- LEFT PANEL: ANIMATED TERMINAL ENGINE LOG STREAM                   -->
    <!-- ================================================================= -->
    <g transform="translate(48, 28)">
      <!-- Window Frame -->
      <rect width="540" height="224" rx="12" fill="#ffffff" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1.2"/>
      
      <!-- Top Title Bar -->
      <rect width="540" height="32" rx="12" fill="#f1f5f9" opacity="0.9"/>
      <rect y="22" width="540" height="10" fill="#ffffff" opacity="0.8"/>
      <line x1="0" y1="32" x2="540" y2="32" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>

      <circle cx="18" cy="16" r="4" fill="#ef4444"/>
      <circle cx="30" cy="16" r="4" fill="#f59e0b"/>
      <circle cx="42" cy="16" r="4" fill="#10b981"/>
      <text x="270" y="20" font-family="'SF Mono', Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">ashmit_engine.sh</text>

      <!-- Terminal Body Content -->
      <g class="font-mono" font-size="11" font-weight="500" transform="translate(18, 48)">
        <text y="16" fill="#059669">● ENGINE ONLINE — All systems active</text>

        <text y="38" fill="#2563eb">❯ <tspan fill="#64748b">ashmit@agent:~$ </tspan><tspan fill="#0f172a">pnpm run deploy:ai-pipeline</tspan></text>

        <text y="60" fill="#64748b">[1/3] Ingesting Llama-3 &amp; Groq LLM Agents...</text>

        <!-- Animated Progress Bar -->
        <g transform="translate(0, 72)">
          <rect width="320" height="12" rx="6" fill="rgba(15,23,42,0.06)"/>
          <rect height="12" rx="6" fill="url(#borderShimmer)">
            <animate attributeName="width" values="0;320;320;0" keyTimes="0;0.7;0.9;1" dur="5s" repeatCount="indefinite"/>
          </rect>
          <text x="332" y="10" font-size="10" fill="#059669" font-weight="600">100%</text>
        </g>

        <text y="106" fill="#7c3aed">[2/3] WebSockets Real-Time Stream Ready (42ms)</text>
        <text y="126" fill="#059669">[3/3] Deployment Successful! 🚀</text>

        <text y="150" fill="#2563eb">❯ <tspan fill="#64748b">ashmit@agent:~$ </tspan><tspan fill="#059669">listening for events...</tspan></text>
        
        <!-- Blinking Terminal Cursor -->
        <rect x="250" y="140" width="7" height="13" fill="#2563eb">
          <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- ================================================================= -->
    <!-- CENTER DIVIDER: ANIMATED VOICE & MEDIA WAVEFORM EQUALIZER         -->
    <!-- ================================================================= -->
    <g transform="translate(615, 0)">
      <line x1="0" y1="40" x2="0" y2="240" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>

      <!-- Animated Equalizer Bars -->
      <g transform="translate(-18, 0)">
        <rect x="0" y="130" width="3" height="20" rx="1.5" fill="url(#waveGrad)">
          <animate attributeName="height" values="8;44;8" dur="1.1s" repeatCount="indefinite"/>
          <animate attributeName="y" values="136;118;136" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="7" y="120" width="3" height="40" rx="1.5" fill="url(#waveGrad)">
          <animate attributeName="height" values="12;52;12" dur="1.3s" repeatCount="indefinite"/>
          <animate attributeName="y" values="134;114;134" dur="1.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="14" y="110" width="3" height="60" rx="1.5" fill="url(#waveGrad)">
          <animate attributeName="height" values="20;64;20" dur="0.9s" repeatCount="indefinite"/>
          <animate attributeName="y" values="130;108;130" dur="0.9s" repeatCount="indefinite"/>
        </rect>
        <rect x="21" y="125" width="3" height="30" rx="1.5" fill="url(#waveGrad)">
          <animate attributeName="height" values="10;40;10" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="135;120;135" dur="1.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="28" y="135" width="3" height="15" rx="1.5" fill="url(#waveGrad)">
          <animate attributeName="height" values="6;28;6" dur="1.0s" repeatCount="indefinite"/>
          <animate attributeName="y" values="137;126;137" dur="1.0s" repeatCount="indefinite"/>
        </rect>
      </g>

      <text x="0" y="258" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#64748b" text-anchor="middle">VOICE STREAM</text>
    </g>

    <!-- ================================================================= -->
    <!-- RIGHT PANEL: ANIMATED ROTATING NEURAL TECH RADAR ORBIT            -->
    <!-- ================================================================= -->
    <g transform="translate(658, 28)">
      <!-- Outer Target Rings -->
      <circle cx="227" cy="112" r="100" fill="none" stroke="rgba(37, 99, 235, 0.15)" stroke-width="1.2"/>
      <circle cx="227" cy="112" r="70" fill="none" stroke="rgba(124, 58, 237, 0.2)" stroke-width="1"/>
      <circle cx="227" cy="112" r="40" fill="none" stroke="rgba(5, 150, 105, 0.25)" stroke-width="1"/>

      <!-- Center Core Badge -->
      <circle cx="227" cy="112" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="227" y="116" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">AI</text>

      <!-- ROTATING OUTER RADAR RING 1 (Native SMIL Transform) -->
      <g transform="translate(227, 112)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
          
          <circle cx="0" cy="0" r="100" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="8 8" opacity="0.5"/>
          
          <!-- Orbit Nodes -->
          <g transform="translate(0, -100)">
            <circle r="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
            <text y="4" class="font-sans" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">Next</text>
          </g>
          <g transform="translate(100, 0)">
            <circle r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
            <text y="4" class="font-sans" font-size="9" font-weight="700" fill="#7c3aed" text-anchor="middle">Groq</text>
          </g>
          <g transform="translate(0, 100)">
            <circle r="14" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
            <text y="4" class="font-sans" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">Py</text>
          </g>
          <g transform="translate(-100, 0)">
            <circle r="14" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
            <text y="4" class="font-sans" font-size="9" font-weight="700" fill="#e11d48" text-anchor="middle">TS</text>
          </g>
        </g>
      </g>

      <!-- ROTATING REVERSE INNER RADAR RING 2 (Native SMIL Transform) -->
      <g transform="translate(227, 112)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="70" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
          <circle cx="0" cy="-70" r="4" fill="#7c3aed"/>
          <circle cx="0" cy="70" r="4" fill="#059669"/>
        </g>
      </g>
    </g>

    <!-- Outer Frame Shimmer Border -->
    <rect x="1" y="1" width="1178" height="278" rx="16" fill="none" stroke="url(#borderShimmer)" stroke-width="1.5" opacity="0.45"/>
  </g>
</svg>
