    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="70%">
