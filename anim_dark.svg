    </radialGradient>

    <!-- Border Shimmer -->
    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity=".4"/>
    </linearGradient>

    <!-- Progress Bar Gradients -->
